<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Financiero</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary: #3b82f6;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #121212;
            --card-bg: #1e1e1e;
            --text-primary: #f3f4f6;
            --text-secondary: #9ca3af;
            --border: #2d2d2d;
            --radius: 8px;
        }

        * { box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text-primary);
            margin: 0;
            padding: 16px;
            overflow-x: hidden;
        }

        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 0;
        }

        /* Header con resumen */
        .header {
            background: var(--card-bg);
            padding: 20px 16px;
            border-radius: var(--radius);
            margin-bottom: 20px;
            border: 1px solid var(--border);
            width: 100%;
        }

        .header-title {
            font-size: 18px;
            font-weight: 700;
            margin: 0 0 16px 0;
            color: var(--text-primary);
        }

        .summary-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .summary-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 0;
        }

        .summary-label {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .summary-value {
            font-size: 18px;
            font-weight: 700;
            color: var(--text-primary);
            word-break: break-all;
        }

        .summary-value.income { color: var(--success); }
        .summary-value.spent { color: var(--danger); }
        .summary-value.saved { color: var(--warning); }
        .summary-value.available { color: var(--primary); }

        /* Secciones principales */
        .section {
            background: var(--card-bg);
            margin-bottom: 20px;
            border-radius: var(--radius);
            border: 1px solid var(--border);
            overflow: hidden;
            width: 100%;
        }

        .section-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-weight: 600;
            font-size: 13px;
            color: var(--text-primary);
            background: #18181b;
        }

        .section-content {
            padding: 16px;
            width: 100%;
        }

        /* Inputs y campos */
        .input-group {
            margin-bottom: 12px;
            width: 100%;
        }

        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            max-width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            background: #27272a;
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.15s;
        }

        input:focus,
        select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        /* Ingresos y fondo */
        .income-field {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 8px;
            width: 100%;
        }

        .income-field label {
            font-size: 14px;
            font-weight: 500;
            flex: 1;
            color: var(--text-primary);
            min-width: 0;
            word-break: break-word;
        }

        .income-field input {
            width: 120px;
            flex-shrink: 0;
            margin: 0;
        }

        /* Grid de botones de servicio */
        .button-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        /* Botones */
        button {
            padding: 10px 14px;
            border: 1px solid var(--border);
            background: #27272a;
            color: var(--text-primary);
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s;
            outline: none;
        }

        button:hover {
            border-color: var(--primary);
            background: #3f3f46;
        }

        button:active {
            background: #52525b;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            width: 100%;
        }

        .btn-primary:hover {
            background: #2563eb;
            border-color: #2563eb;
        }

        .btn-secondary {
            background: #27272a;
            border-color: var(--border);
            width: 100%;
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: #3f3f46;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            border-color: var(--danger);
            padding: 6px 10px;
            font-size: 12px;
            width: auto;
            flex-shrink: 0;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-ticket {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            margin-top: 4px;
            margin-bottom: 24px;
            width: 100%;
        }

        .btn-ticket:hover {
            background: #2563eb;
        }

        /* Lista de items */
        #itemList {
            list-style: none;
            padding: 0;
            margin: 0;
            width: 100%;
        }

        #itemList li {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
        }

        #itemList li:last-child {
            border-bottom: none;
        }

        .date-header {
            padding: 12px 16px;
            background: #18181b;
            border-bottom: 1px solid var(--border);
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
        }

        .item-info {
            flex: 1;
            min-width: 0;
        }

        .item-name {
            display: block;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            margin-bottom: 6px;
            word-break: break-word;
        }

        .item-meta {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 11px;
        }

        .item-store,
        .item-category,
        .item-source {
            color: var(--text-secondary);
            background: #27272a;
            padding: 2px 6px;
            border-radius: 3px;
            word-break: break-all;
        }

        .item-category {
            color: #c084fc;
            background: #3b2854;
        }

        .item-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 6px;
            flex-shrink: 0;
        }

        .item-price {
            font-weight: 700;
            font-size: 14px;
            word-break: break-all;
        }

        /* Modal de ticket */
        #ticketModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            max-height: 85vh;
            overflow-y: auto;
            width: 100%;
            max-width: 480px;
            padding: 20px;
        }

        .modal-header {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
            color: var(--text-primary);
        }

        .modal-header small {
            display: block;
            font-size: 12px;
            font-weight: 400;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .ticket-table {
            width: 100%;
            font-size: 13px;
            border-collapse: collapse;
            margin-bottom: 20px;
        }

        .ticket-table td {
            padding: 10px 0;
            border-bottom: 1px solid var(--border);
            word-break: break-word;
        }

        .ticket-table td:first-child { width: 65%; }
        .ticket-table td:last-child { text-align: right; font-weight: 600; width: 35%; }

        .ticket-summary {
            display: flex;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            margin-bottom: 20px;
            padding: 14px;
            background: #18181b;
            border-radius: 6px;
            border: 1px solid var(--border);
        }

        .ticket-summary div {
            display: flex;
            justify-content: space-between;
            gap: 8px;
        }

        .ticket-summary span:first-child {
            color: var(--text-secondary);
        }

        .ticket-summary b {
            color: var(--text-primary);
            word-break: break-all;
        }

        .modal-buttons {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }

        .modal-buttons button {
            flex: 1;
        }

        /* Checkbox */
        input[type="checkbox"] {
            cursor: pointer;
            width: 16px;
            height: 16px;
            accent-color: var(--primary);
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .checkbox-group label {
            font-size: 14px;
            cursor: pointer;
            color: var(--text-primary);
        }
    </style>
</head>
<body>

<div class="container">
    <!-- HEADER CON RESUMEN -->
    <div class="header">
        <div class="header-title">Mi Control Financiero</div>
        <div class="summary-grid">
            <div class="summary-item">
                <span class="summary-label">Ingresos</span>
                <span class="summary-value income" id="totalIncomeDisplay">$0.00</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Gastos</span>
                <span class="summary-value spent" id="totalSpent">$0.00</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Ahorros</span>
                <span class="summary-value saved" id="totalSavedSum">$0.00</span>
            </div>
            <div class="summary-item">
                <span class="summary-label">Disponible</span>
                <span class="summary-value available" id="totalAvailable">$0.00</span>
            </div>
        </div>
    </div>

    <!-- INGRESOS -->
    <div class="section">
        <div class="section-header">Configura tus ingresos y fondo</div>
        <div class="section-content">
            <div class="income-field">
                <label>Vales</label>
                <input type="number" id="valesInput" placeholder="0.00" oninput="updateValues()">
            </div>
            <div class="income-field">
                <label>Sueldo</label>
                <input type="number" id="sueldoInput" placeholder="0.00" oninput="updateValues()">
            </div>
            <div class="income-field">
                <label>Otro</label>
                <input type="number" id="otroInput" placeholder="0.00" oninput="updateValues()">
            </div>
            <div class="income-field">
                <label>Fondo Base</label>
                <input type="number" id="budgetInput" placeholder="0.00" oninput="updateValues()">
            </div>
        </div>
    </div>

    <!-- AGREGAR GASTO -->
    <div class="section">
        <div class="section-header">Registra un gasto</div>
        <div class="section-content">
            <div class="input-group">
                <input type="text" id="itemName" placeholder="Qué compraste">
            </div>
            <div class="input-group">
                <input type="number" id="itemPrice" placeholder="Cantidad">
            </div>
            <div class="input-group">
                <input type="text" id="itemStore" placeholder="Dónde (opcional)">
            </div>
            <div class="input-group">
                <select id="itemCategory">
                    <option value="">Categoría</option>
                    <option value="Comida">Comida</option>
                    <option value="Transporte">Transporte</option>
                    <option value="Salud">Salud</option>
                    <option value="Diversión">Diversión</option>
                    <option value="Otro">Otro</option>
                </select>
            </div>
            <div class="input-group">
                <select id="itemIncomeSource">
                    <option value="Sueldo">De: Sueldo</option>
                    <option value="Vales">De: Vales</option>
                    <option value="Otro">De: Otro</option>
                </select>
            </div>
            <div class="checkbox-group">
                <input type="checkbox" id="walmartCheck">
                <label for="walmartCheck">Descuento Walmart (10%)</label>
            </div>
            <button class="btn-primary" onclick="addItem()">Agregar gasto</button>
        </div>
    </div>

    <!-- SERVICIOS FIJOS -->
    <div class="section">
        <div class="section-header">Gastos fijos</div>
        <div class="section-content">
            <div class="button-grid">
                <button onclick="toggleServiceInput('Internet')">🌐 Internet</button>
                <button onclick="toggleServiceInput('Teléfono')">📱 Teléfono</button>
                <button onclick="toggleServiceInput('Agua')">💧 Agua</button>
                <button onclick="toggleServiceInput('Luz')">💡 Luz</button>
                <button onclick="toggleServiceInput('Streaming')">📺 Streaming</button>
                <button onclick="toggleServiceInput('Gimnasio')">💪 Gimnasio</button>
            </div>
            <div id="serviceInputsContainer"></div>
        </div>
    </div>

    <!-- AHORRAR -->
    <div class="section">
        <div class="section-header">Ahorrar dinero</div>
        <div class="section-content">
            <div class="input-group">
                <input type="number" id="saveAmount" placeholder="Cantidad a ahorrar">
            </div>
            <div class="input-group">
                <select id="saveIncomeSource">
                    <option value="Sueldo">De: Sueldo</option>
                    <option value="Vales">De: Vales</option>
                    <option value="Otro">De: Otro</option>
                </select>
            </div>
            <button class="btn-primary" onclick="addSavings()">Guardar en alcancía</button>
        </div>
    </div>

    <!-- HISTORIAL -->
    <div class="section">
        <div class="section-header">Historial</div>
        <div class="section-content" style="padding: 0;">
            <ul id="itemList"></ul>
        </div>
    </div>

    <!-- TICKET -->
    <button class="btn-ticket" onclick="generateTicket()">📋 Ver resumen completo</button>
</div>

<!-- MODAL DE TICKET -->
<div id="ticketModal">
    <div class="modal-content">
        <div class="modal-header">
            Resumen Financiero
            <small id="ticketDate"></small>
        </div>
        <table class="ticket-table">
            <tbody id="ticketTableBody"></tbody>
        </table>
        <div class="ticket-summary" id="ticketSummaryContent"></div>
        <div class="modal-buttons">
            <button class="btn-secondary" onclick="closeTicket()">Cerrar</button>
            <button class="btn-primary" onclick="printTicket()">Imprimir</button>
        </div>
    </div>
</div>

<script>
    let items = [];
    let services = {};
    let incomes = { vales: '', sueldo: '', otro: '', budget: '' };

    function saveToLocalStorage() {
        localStorage.setItem('items', JSON.stringify(items));
        localStorage.setItem('services', JSON.stringify(services));
        localStorage.setItem('incomes', JSON.stringify(incomes));
    }

    function loadFromLocalStorage() {
        const stored = localStorage.getItem('items');
        const storedServices = localStorage.getItem('services');
        const storedIncomes = localStorage.getItem('incomes');

        if (stored) items = JSON.parse(stored);
        if (storedServices) services = JSON.parse(storedServices);
        if (storedIncomes) {
            incomes = JSON.parse(storedIncomes);
            document.getElementById('valesInput').value = incomes.vales;
            document.getElementById('sueldoInput').value = incomes.sueldo;
            document.getElementById('otroInput').value = incomes.otro;
            document.getElementById('budgetInput').value = incomes.budget;
        }

        renderServiceInputs();
        renderList();
    }

    function updateValues() {
        incomes.vales = document.getElementById('valesInput').value;
        incomes.sueldo = document.getElementById('sueldoInput').value;
        incomes.otro = document.getElementById('otroInput').value;
        incomes.budget = document.getElementById('budgetInput').value;
        saveToLocalStorage();
        renderList();
    }

    function toggleServiceInput(name) {
        const key = `service_${name}`;
        
        if (services[key]) {
            delete services[key];
        } else {
            services[key] = { name, amount: '', source: 'Sueldo' };
        }

        renderServiceInputs();
        saveToLocalStorage();
    }

    function renderServiceInputs() {
        const container = document.getElementById('serviceInputsContainer');
        container.innerHTML = '';

        for (let key in services) {
            if (services.hasOwnProperty(key)) {
                const service = services[key];
                const serviceDiv = document.createElement('div');
                serviceDiv.style.marginBottom = '12px';
                serviceDiv.style.padding = '12px';
                serviceDiv.style.background = '#27272a';
                serviceDiv.style.borderRadius = '6px';
                serviceDiv.style.border = '1px solid #2d2d2d';

                serviceDiv.innerHTML = `
                    <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%;">
                        <div style="flex: 1; min-width: 0;">
                            <div style="font-weight: 600; font-size: 13px; margin-bottom: 6px; color: #f3f4f6; word-break: break-word;">${service.name}</div>
                            <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                                <input type="number" placeholder="Cantidad" value="${service.amount}" style="flex: 1; min-width: 90px;" oninput="updateServiceAmount('${key}', this.value)">
                                <select onchange="updateServiceSource('${key}', this.value)" style="flex: 1; min-width: 90px;">
                                    <option value="Sueldo" ${service.source === 'Sueldo' ? 'selected' : ''}>Sueldo</option>
                                    <option value="Vales" ${service.source === 'Vales' ? 'selected' : ''}>Vales</option>
                                    <option value="Otro" ${service.source === 'Otro' ? 'selected' : ''}>Otro</option>
                                </select>
                            </div>
                        </div>
                        <button class="btn-danger" onclick="toggleServiceInput('${service.name}')">✕</button>
                    </div>
                `;
                container.appendChild(serviceDiv);
            }
        }
    }

    function updateServiceAmount(key, value) {
        if (services[key]) {
            services[key].amount = value;
            saveToLocalStorage();
            renderList();
        }
    }

    function updateServiceSource(key, value) {
        if (services[key]) {
            services[key].source = value;
            saveToLocalStorage();
        }
    }

    function addSavings() {
        const saveInput = document.getElementById('saveAmount');
        const sourceSelect = document.getElementById('saveIncomeSource');
        let amount = parseFloat(saveInput.value);

        if (isNaN(amount) || amount <= 0) {
            alert('Ingresa una cantidad válida para ahorrar.');
            return;
        }

        const now = new Date();
        const fechaStr = now.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });

        items.push({ 
            name: '🎁 Ahorro', 
            price: amount, 
            store: 'Alcancía', 
            category: 'Ahorro',
            source: sourceSelect.value,
            isWalmart: false,
            date: fechaStr,
            isSavings: true
        });

        saveInput.value = '';
        saveToLocalStorage();
        renderList();
    }

    function addItem() {
        const nameInput = document.getElementById('itemName');
        const priceInput = document.getElementById('itemPrice');
        const storeInput = document.getElementById('itemStore');
        const categorySelect = document.getElementById('itemCategory');
        const sourceSelect = document.getElementById('itemIncomeSource');
        const walmartCheck = document.getElementById('walmartCheck');
        
        const name = nameInput.value.trim();
        let price = parseFloat(priceInput.value);
        const store = storeInput.value.trim() || 'General';
        const category = categorySelect.value || 'Otro';
        const source = sourceSelect.value;
        const isWalmart = walmartCheck.checked;

        if (name === '' || isNaN(price) || price <= 0) {
            alert('Ingresa un nombre y un precio válido.');
            return;
        }

        if (isWalmart) {
            price = price * 0.90; 
        }

        const now = new Date();
        const fechaStr = now.toLocaleDateString('es-MX', { day: '2-digit', month: '2-digit', year: 'numeric' });

        items.push({ 
            name: name, 
            price: price, 
            store: store, 
            category: category,
            source: source,
            isWalmart: isWalmart,
            date: fechaStr,
            isSavings: false
        });
        
        nameInput.value = '';
        priceInput.value = '';
        storeInput.value = '';
        categorySelect.selectedIndex = 0;
        walmartCheck.checked = false;
        nameInput.focus();

        saveToLocalStorage();
        renderList();
    }

    function deleteItem(originalIndex) {
        items.splice(originalIndex, 1);
        saveToLocalStorage();
        renderList();
    }

    function renderList() {
        const listElement = document.getElementById('itemList');
        listElement.innerHTML = '';

        let totalSpent = 0;
        let totalSaved = 0;

        items.forEach((item) => {
            if (item.isSavings) totalSaved += item.price;
            else totalSpent += item.price;
        });

        let groupedByDate = {};
        items.forEach((item, originalIndex) => {
            const dateKey = item.date || 'Sin fecha';
            if (!groupedByDate[dateKey]) {
                groupedByDate[dateKey] = [];
            }
            groupedByDate[dateKey].push({ item, originalIndex });
        });

        for (let dateKey in groupedByDate) {
            const dateHeader = document.createElement('div');
            dateHeader.className = 'date-header';
            dateHeader.innerText = `📅 ${dateKey}`;
            listElement.appendChild(dateHeader);

            groupedByDate[dateKey].forEach(({ item, originalIndex }) => {
                const li = document.createElement('li');
                li.innerHTML = `
                    <div class="item-info">
                        <span class="item-name">${item.name}</span>
                        <div class="item-meta">
                            <span class="item-store">${item.store}</span>
                            <span class="item-category">${item.category}</span>
                            <span class="item-source">${item.source}</span>
                        </div>
                    </div>
                    <div class="item-right">
                        <span class="item-price" style="color: ${item.isSavings ? '#f59e0b' : '#ef4444'};">$${item.price.toFixed(2)}</span>
                        <button class="btn-danger" onclick="deleteItem(${originalIndex})">✕</button>
                    </div>
                `;
                listElement.appendChild(li);
            });
        }

        const vales = parseFloat(incomes.vales) || 0;
        const sueldo = parseFloat(incomes.sueldo) || 0;
        const otro = parseFloat(incomes.otro) || 0;
        const totalIncome = vales + sueldo + otro;
        const budget = parseFloat(incomes.budget) || 0;

        document.getElementById('totalIncomeDisplay').innerText = `$${totalIncome.toFixed(2)}`;

        const totalAvailable = (totalIncome + budget) - (totalSpent + totalSaved);

        document.getElementById('totalSpent').innerText = `$${totalSpent.toFixed(2)}`;
        document.getElementById('totalSavedSum').innerText = `$${totalSaved.toFixed(2)}`;
        
        const availableElement = document.getElementById('totalAvailable');
        availableElement.innerText = `$${totalAvailable.toFixed(2)}`;
        availableElement.style.color = totalAvailable < 0 ? '#ef4444' : '#3b82f6';
    }

    function generateTicket() {
        if (items.length === 0) {
            alert('No hay movimientos registrados todavía.');
            return;
        }

        const now = new Date();
        document.getElementById('ticketDate').innerText = now.toLocaleDateString('es-MX', { year: 'numeric', month: 'long', day: 'numeric' });

        const tbody = document.getElementById('ticketTableBody');
        tbody.innerHTML = '';

        let totalSpent = 0;
        let totalSaved = 0;

        items.forEach(item => {
            if (item.isSavings) totalSaved += item.price;
            else totalSpent += item.price;

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>${item.name}</b><br><small style="color: #9ca3af;">${item.category} • ${item.source} • ${item.date}</small></td>
                <td style="color:${item.isSavings ? '#f59e0b' : '#ef4444'};">$${item.price.toFixed(2)}</td>
            `;
            tbody.appendChild(tr);
        });

        const vales = parseFloat(incomes.vales) || 0;
        const sueldo = parseFloat(incomes.sueldo) || 0;
        const otro = parseFloat(incomes.otro) || 0;
        const totalIncome = vales + sueldo + otro;
        const budget = parseFloat(incomes.budget) || 0;
        const totalAvailable = (totalIncome + budget) - (totalSpent + totalSaved);

        const summaryDiv = document.getElementById('ticketSummaryContent');
        summaryDiv.innerHTML = `
            <div><span>Ingresos totales:</span> <b>$${totalIncome.toFixed(2)}</b></div>
            <div><span>Fondo base:</span> <b>$${budget.toFixed(2)}</b></div>
            <div><span>Gastos:</span> <b style="color:#ef4444;">−$${totalSpent.toFixed(2)}</b></div>
            <div><span>Ahorros:</span> <b style="color:#f59e0b;">−$${totalSaved.toFixed(2)}</b></div>
            <div style="border-top: 1px solid var(--border); padding-top: 8px; margin-top: 8px;"><span>Disponible:</span> <b style="color:${totalAvailable >= 0 ? '#10b981' : '#ef4444'};">$${totalAvailable.toFixed(2)}</b></div>
        `;

        document.getElementById('ticketModal').style.display = 'flex';
    }

    function closeTicket() {
        document.getElementById('ticketModal').style.display = 'none';
    }

    function printTicket() {
        window.print();
    }

    // Inicializar
    loadFromLocalStorage();
</script>

</body>
</html>
